<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>中國象棋 · 盲棋（暗棋）</title>
<meta name="theme-color" content="#0b1520">
<style>
  :root{
    --bg:#0a131c; --panel:#101f2b; --line:rgba(120,200,255,.18);
    --cyan:#4ce0ff; --green:#5fffb0; --gold:#ffd54f; --red:#ff6f60;
    --txt:#dceef5; --dim:#8fb0c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(120% 80% at 50% 0%,#13283a 0%,var(--bg) 60%,#060d14 100%);color:var(--txt);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100%}
  body{padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
  a{color:var(--cyan);text-decoration:none}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;background:rgba(76,224,255,.10);border:1px solid rgba(76,224,255,.42);color:var(--cyan);padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:800}
  .title{font-size:15px;font-weight:900;letter-spacing:.5px}
  .title small{display:block;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.3px;margin-top:2px}

  /* 回合橫幅：全頁唯一負責「現在輪到誰」 */
  .turn{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;border:1px solid rgba(76,224,255,.45);background:rgba(76,224,255,.14);transition:background .18s,border-color .18s}
  .turn.mine{border-color:rgba(95,255,176,.55);background:rgba(95,255,176,.13)}
  .turn.ai{border-color:rgba(76,224,255,.5);background:rgba(76,224,255,.12)}
  .turn.end{border-color:rgba(255,213,79,.6);background:rgba(255,213,79,.14)}
  .turn-main{flex:1 1 auto;min-width:0}
  .turn-head{font-size:15.5px;font-weight:900;line-height:1.25;color:var(--green)}
  .turn.ai .turn-head{color:#b3e5fc}
  .turn.end .turn-head{color:var(--gold)}
  .turn-detail{font-size:11.5px;color:#9bb8c9;margin-top:3px;line-height:1.5}
  .turn-tag{flex:0 0 auto;font-size:11px;color:var(--dim);text-align:right;line-height:1.4}
  .turn-tag b{display:block;font-size:12.5px;color:#cfe9f5}

  .last{margin-top:6px;font-size:11.5px;color:#ffcc80;min-height:16px}

  .stat{display:flex;gap:8px;margin-top:8px}
  .stat div{flex:1 1 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center}
  .stat small{display:block;font-size:10.5px;color:var(--dim);margin-bottom:2px}
  .stat b{font-size:14px}

  .board-wrap{margin-top:10px;padding:8px;border-radius:14px;background:linear-gradient(180deg,#0f2434,#0b1a26);border:1px solid var(--line)}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .cell{position:relative;aspect-ratio:1/1;border-radius:9px;border:1px solid rgba(140,200,230,.16);background:#0d212e;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;transition:transform .08s,box-shadow .15s,border-color .15s}
  .cell:active{transform:scale(.96)}
  .cell.sel{border-color:var(--green);box-shadow:0 0 0 2px rgba(95,255,176,.45) inset}
  .cell.hint::after{content:"";width:26%;height:26%;border-radius:50%;background:rgba(76,224,255,.65);position:absolute;box-shadow:0 0 6px rgba(76,224,255,.6)}
  .cell.hint.atk::after{width:74%;height:74%;border-radius:12px;background:transparent;border:2px dashed rgba(255,111,96,.75);box-shadow:none}
  .piece{width:86%;height:86%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(15px,4.6vw,24px);line-height:1}
  .piece.red{color:#ff7b6b;background:radial-gradient(120% 120% at 30% 20%,#fff3ee,#ffe0d8);border:1px solid #ff9d8f;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .piece.black{color:#1f2b36;background:radial-gradient(120% 120% at 30% 20%,#f7fbff,#dfe9f2);border:1px solid #9fb4c4;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .piece.back{color:#7fd7ff;background:radial-gradient(120% 120% at 30% 20%,#1d3f57,#122b3d);border:1px solid rgba(120,200,255,.45);font-size:clamp(13px,4vw,20px)}
  .piece.pending{opacity:.75;filter:saturate(.8)}

  .msg{margin-top:8px;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.55;background:rgba(30,58,76,.55);color:#dceee5;border:1px solid transparent}
  .msg.warn{background:rgba(198,40,40,.22);color:#ffb0a6;border-color:rgba(255,111,96,.4)}

  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button.btn{flex:1 1 0;min-width:96px;padding:11px 10px;border-radius:11px;border:1px solid rgba(76,224,255,.45);background:rgba(76,224,255,.14);color:var(--cyan);font-size:13.5px;font-weight:800;font-family:inherit}
  button.btn.ghost{background:rgba(255,255,255,.04);border-color:rgba(160,200,225,.3);color:#cfe4ef}
  button.btn:disabled{opacity:.42}
  .opts{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .opts h3{margin:0 0 8px;font-size:12.5px;color:var(--dim);font-weight:800;letter-spacing:.4px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed rgba(140,200,230,.14);font-size:12.5px}
  .opt:first-of-type{border-top:0}
  .opt small{display:block;color:var(--dim);font-size:11px;margin-top:2px;line-height:1.4}
  .sw{flex:0 0 auto;width:46px;height:26px;border-radius:99px;background:rgba(160,200,225,.22);border:1px solid rgba(160,200,225,.3);position:relative;transition:background .16s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#dbe9f2;transition:left .16s}
  .sw.on{background:rgba(95,255,176,.5);border-color:rgba(95,255,176,.75)}
  .sw.on::after{left:22px;background:#0b1520}
  .log{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:190px;overflow:auto;font-size:12px;line-height:1.7;color:#b9d3e0}
  .log div{border-bottom:1px dashed rgba(140,200,230,.12);padding:2px 0}
  .log div:last-child{border-bottom:0}
  .foot{margin-top:12px;font-size:11px;color:var(--dim);line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html">‹ 首頁</a>
  <div class="title">中國象棋 · 盲棋（暗棋）
    <small>翻棋定陣營 · 大吃小 · 炮隔子吃 · 與 App 同款規則</small>
  </div>
</div>

<!-- 回合狀態：現在輪到哪一方行動 -->
<div class="turn" id="turnBar">
  <div class="turn-main">
    <div class="turn-head" id="turnHead">輪到你 · 陣營未定</div>
    <div class="turn-detail" id="turnDetail">請翻第一枚暗棋決定陣營</div>
  </div>
  <div class="turn-tag"><b id="turnTag">第 0 手</b><span id="turnSide">我方先手</span></div>
</div>
<div class="last" id="lastEvent"></div>

<div class="stat">
  <div><small>紅方剩子</small><b id="cntRed">16</b></div>
  <div><small>黑方剩子</small><b id="cntBlack">16</b></div>
  <div><small>我方陣營</small><b id="mySide">未定</b></div>
  <div><small>手數</small><b id="cntMove">0</b></div>
</div>

<div class="board-wrap"><div class="board" id="board"></div></div>

<div class="msg" id="msg">先隨意翻開一枚暗棋，那枚棋的顏色就是你的陣營</div>

<div class="row">
  <button class="btn" id="btnNew">新的一局</button>
  <button class="btn ghost" id="btnUndo">悔棋</button>
  <button class="btn ghost" id="btnMode">對 AI：開</button>
</div>

<div class="opts">
  <h3>規則約定（與 App 一致，預設同為關閉）</h3>
  <div class="opt"><div>搏大霧<small>可貼身撞吃暗棋，翻開比大小，大吃小、小則反被吃</small></div><div class="sw" id="swFog"></div></div>
  <div class="opt"><div>車直衝多格<small>俥／車可沿直線衝到空格或吃子格</small></div><div class="sw" id="swRook"></div></div>
  <div class="opt"><div>連食<small>吃子後可再行動一步（最多連續 8 次）</small></div><div class="sw" id="swChain"></div></div>
</div>

<div class="log" id="log"></div>
<div class="foot">盲棋＝暗棋／翻棋：32 枚棋子背面朝上鋪滿半盤，先翻開的顏色為先手陣營。<br>一方被吃光，或輪到時無任何合法步可走即負。</div>

<script>
(function(){
"use strict";

/* ================= 規則引擎（與 App 端 XiangqiBlindGame.kt 同步） ================= */
var XD_W = 4, XD_H = 8, XD_SIZE = 32;
var KIND = {
  KING:     { red:"帥", black:"將", rank:7, value:90 },
  ADVISOR:  { red:"仕", black:"士", rank:6, value:46 },
  ELEPHANT: { red:"相", black:"象", rank:5, value:42 },
  ROOK:     { red:"俥", black:"車", rank:4, value:52 },
  HORSE:    { red:"傌", black:"馬", rank:3, value:38 },
  CANNON:   { red:"炮", black:"砲", rank:2, value:32 },
  PAWN:     { red:"兵", black:"卒", rank:1, value:14 }
};
var DIRS = [[0,-1],[1,0],[0,1],[-1,0]];

function kLabel(red, kind){ return red ? KIND[kind].red : KIND[kind].black; }
function pLabel(p){ return p ? kLabel(p.red, p.kind) : ""; }

function fullSet(){
  var out = [], kinds = ["KING","ADVISOR","ELEPHANT","ROOK","HORSE","CANNON","PAWN"];
  var counts = { KING:1, ADVISOR:2, ELEPHANT:2, ROOK:2, HORSE:2, CANNON:2, PAWN:5 };
  [true,false].forEach(function(red){
    kinds.forEach(function(k){
      for (var i=0;i<counts[k];i++) out.push({ red:red, kind:k, revealed:false });
    });
  });
  return out;
}
function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function newState(){
  return { board: shuffle(fullSet()), seatARed: null, turn: 0, chainUsed: 0 };
}
function cloneState(s){
  return { board: s.board.slice(), seatARed: s.seatARed, turn: s.turn, chainUsed: s.chainUsed };
}
function sideOf(s, seat){
  if (s.seatARed === null || s.seatARed === undefined) return null;
  return seat === 0 ? s.seatARed : !s.seatARed;
}
function countOf(s, red){ return s.board.filter(function(p){ return p && p.red === red; }).length; }
function idx(x,y){ return y*XD_W + x; }
function inBoard(x,y){ return x>=0 && x<XD_W && y>=0 && y<XD_H; }
function step(i, dx, dy){
  var x = (i % XD_W) + dx, y = Math.floor(i / XD_W) + dy;
  return inBoard(x,y) ? idx(x,y) : -1;
}
function manhattan(a,b){
  return Math.abs((a%XD_W)-(b%XD_W)) + Math.abs(Math.floor(a/XD_W)-Math.floor(b/XD_W));
}
function aligned(a,b){ return (a%XD_W)===(b%XD_W) || Math.floor(a/XD_W)===Math.floor(b/XD_W); }
function cellName(i){
  var c = i % XD_W, r = Math.floor(i / XD_W);
  return "ABCDEFGH".charAt(c%8) + (r+1);
}
function betweenCount(board, from, to){
  if (!aligned(from,to) || from===to) return -1;
  var fx=from%XD_W, fy=Math.floor(from/XD_W), tx=to%XD_W, ty=Math.floor(to/XD_W);
  var dx=Math.sign(tx-fx), dy=Math.sign(ty-fy);
  var x=fx+dx, y=fy+dy, n=0;
  while (x!==tx || y!==ty){ if (board[idx(x,y)]) n++; x+=dx; y+=dy; }
  return n;
}
function pathClear(board, from, to){ return betweenCount(board, from, to)===0; }

/* 大吃小、同級互食；兵可吃帥、帥不能吃兵 */
function canEat(eaterKind, victimKind){
  if (eaterKind==="PAWN" && victimKind==="KING") return true;
  if (eaterKind==="KING" && victimKind==="PAWN") return false;
  return KIND[eaterKind].rank >= KIND[victimKind].rank;
}

function legalActions(s, cfg){
  var out = [], seen = {}, i, p, side, dir, to, t, q, cur, screen, dist;
  function push(a){
    var k = (a.flip?"F":"M") + ":" + a.from + ":" + a.to;
    if (!seen[k]){ seen[k]=1; out.push(a); }
  }
  for (i=0;i<XD_SIZE;i++){
    p = s.board[i];
    if (p && !p.revealed) push({ flip:true, from:-1, to:i });
  }
  side = sideOf(s, s.turn);
  if (side === null) return out;
  for (var from=0; from<XD_SIZE; from++){
    p = s.board[from];
    if (!p || !p.revealed || p.red !== side) continue;
    for (dir=0; dir<4; dir++){
      to = step(from, DIRS[dir][0], DIRS[dir][1]);
      if (to < 0) continue;
      t = s.board[to];
      if (!t){ push({ flip:false, from:from, to:to }); continue; }
      if (t.revealed){
        if (t.red === p.red) continue;
        if (p.kind === "CANNON"){
          if (betweenCount(s.board, from, to) === 1) push({ flip:false, from:from, to:to });
        } else if (canEat(p.kind, t.kind)){
          push({ flip:false, from:from, to:to });
        }
      } else {
        if (p.kind === "CANNON") continue;
        if (cfg.fog) push({ flip:false, from:from, to:to });
      }
    }
    if (p.kind === "CANNON"){
      for (dir=0; dir<4; dir++){
        cur = from; screen = false;
        while (true){
          cur = step(cur, DIRS[dir][0], DIRS[dir][1]);
          if (cur < 0) break;
          q = s.board[cur];
          if (!screen){ if (q) screen = true; }
          else if (q){
            if (!q.revealed || q.red !== p.red) push({ flip:false, from:from, to:cur });
            break;
          }
        }
      }
    }
    if (p.kind === "ROOK" && cfg.rookRush){
      for (dir=0; dir<4; dir++){
        cur = from; dist = 0;
        while (true){
          cur = step(cur, DIRS[dir][0], DIRS[dir][1]);
          if (cur < 0) break;
          dist++;
          q = s.board[cur];
          if (!q){ push({ flip:false, from:from, to:cur }); continue; }
          if (q.revealed){
            if (canEat(p.kind, q.kind)) push({ flip:false, from:from, to:cur });
            break;
          }
          if (cfg.fog && dist === 1) push({ flip:false, from:from, to:cur });
          break;
        }
      }
    }
  }
  return out;
}

/* 點擊翻譯：先結算走子／吃子，再看是否翻子（順序顛倒會出現假動作） */
function tapAction(s, cfg, sel, tapped){
  if (tapped < 0 || tapped >= XD_SIZE) return null;
  var acts = legalActions(s, cfg), i;
  if (sel >= 0){
    for (i=0;i<acts.length;i++){
      if (!acts[i].flip && acts[i].from === sel && acts[i].to === tapped) return acts[i];
    }
  }
  var p = s.board[tapped];
  if (p && !p.revealed){
    for (i=0;i<acts.length;i++){ if (acts[i].flip && acts[i].to === tapped) return acts[i]; }
  }
  return null;
}

function applyAction(s, a, cfg){
  var board = s.board.slice(), p, target, from, to, text, ate, dist, rookFly, win, next, seatARed, keepTurn;

  if (a.flip){
    p = board[a.to];
    if (!p) return { ok:false, state:s, text:"這裡沒有棋" };
    if (p.revealed) return { ok:false, state:s, text:"這枚棋已經翻開了" };
    board[a.to] = { red:p.red, kind:p.kind, revealed:true };
    text = "翻開 " + pLabel(p);
    seatARed = s.seatARed;
    if (seatARed === null || seatARed === undefined){
      seatARed = p.red;
      text = "首翻 " + pLabel(p) + " → " + (p.red ? "紅方" : "黑方") + "執子";
    }
    next = cloneState(s);
    next.board = board; next.seatARed = seatARed; next.turn = 1 - s.turn; next.chainUsed = 0;
    return { ok:true, state:next, text:text, flipped:true, ate:false };
  }

  from = a.from; to = a.to;
  p = board[from];
  if (!p) return { ok:false, state:s, text:"起點沒有棋" };
  if (!p.revealed) return { ok:false, state:s, text:"暗棋不能移動，只能翻開" };
  var side = sideOf(s, s.turn);
  if (side === null) return { ok:false, state:s, text:"尚未定陣營" };
  if (p.red !== side) return { ok:false, state:s, text:"那是對方的棋，不能動" };
  if (to < 0 || to >= XD_SIZE) return { ok:false, state:s, text:"目標格不存在" };
  target = board[to];
  ate = false;

  if (!target){
    dist = manhattan(from, to);
    rookFly = p.kind === "ROOK" && cfg.rookRush && dist > 1 && aligned(from,to) && pathClear(s.board, from, to);
    if (dist !== 1 && !rookFly) return { ok:false, state:s, text:"只能走一格（或開啟車直衝多格）" };
    board[from] = null; board[to] = p;
    text = pLabel(p) + " " + cellName(from) + "→" + cellName(to);
  } else if (!target.revealed){
    var cannonFly = p.kind === "CANNON";
    if (cannonFly){
      if (betweenCount(s.board, from, to) !== 1) return { ok:false, state:s, text:"炮要吃子必須隔一枚棋子" };
    } else {
      if (!cfg.fog) return { ok:false, state:s, text:"明棋不能直接撞吃暗棋（可開啟搏大霧）" };
      if (manhattan(from, to) !== 1) return { ok:false, state:s, text:"撞吃暗棋只能貼身相鄰" };
    }
    win = cannonFly || canEat(p.kind, target.kind);
    if (win){
      board[from] = null; board[to] = p;
      text = cannonFly
        ? "炮隔子飛吃暗棋：翻開是 " + pLabel(target) + "，炮進駐 " + cellName(to) + "，該子已移出棋盤"
        : "撞開 " + pLabel(target) + "：" + pLabel(p) + "(" + KIND[p.kind].rank + ") ≥ " + KIND[target.kind].rank + "，吃子成功";
      ate = true;
    } else {
      board[from] = null;
      board[to] = { red:target.red, kind:target.kind, revealed:true };
      text = "撞開 " + pLabel(target) + "：" + pLabel(p) + "(" + KIND[p.kind].rank + ") < " + KIND[target.kind].rank + "，反被吃掉";
      ate = true;
    }
  } else {
    if (target.red === p.red) return { ok:false, state:s, text:"不能吃己方棋子" };
    if (p.kind === "CANNON"){
      if (betweenCount(s.board, from, to) !== 1) return { ok:false, state:s, text:"炮要吃子必須隔一枚棋子" };
    } else {
      dist = manhattan(from, to);
      rookFly = p.kind === "ROOK" && cfg.rookRush && dist > 1 && aligned(from,to) && pathClear(s.board, from, to);
      if (dist !== 1 && !rookFly) return { ok:false, state:s, text:"只能走一格（或開啟車直衝多格）" };
      if (!canEat(p.kind, target.kind)) return { ok:false, state:s, text:"等級不足：" + pLabel(p) + " 吃不了 " + pLabel(target) };
    }
    board[from] = null; board[to] = p;
    text = pLabel(p) + " 吃掉 " + pLabel(target) + "（" + cellName(to) + "）";
    ate = true;
  }

  keepTurn = ate && cfg.chain && s.chainUsed < 8;
  next = cloneState(s);
  next.board = board;
  next.turn = keepTurn ? s.turn : 1 - s.turn;
  next.chainUsed = keepTurn ? s.chainUsed + 1 : 0;
  return { ok:true, state:next, text: keepTurn ? (text + "，連食再來一步") : text, ate:ate, flipped:false };
}

function statusOf(s, cfg){
  var reds = countOf(s, true), blacks = countOf(s, false);
  if (s.seatARed !== null && s.seatARed !== undefined && (reds === 0 || blacks === 0)){
    var redSeat = s.seatARed ? 0 : 1;
    if (reds === 0) return { over:true, winnerSeat: 1-redSeat, reason:"黑方吃光了紅方全部棋子" };
    return { over:true, winnerSeat: redSeat, reason:"紅方吃光了黑方全部棋子" };
  }
  if (legalActions(s, cfg).length === 0){
    return { over:true, winnerSeat: 1-s.turn, reason:"輪到的一方無任何合法步可走" };
  }
  return { over:false, winnerSeat:null, reason:"" };
}

function evalFor(s, seat){
  var side = sideOf(s, seat);
  if (side === null) return 0;
  var v = 0;
  s.board.forEach(function(p){
    if (!p) return;
    var w = p.revealed ? KIND[p.kind].value : Math.floor(KIND[p.kind].value * 6 / 10);
    v += (p.red === side) ? w : -w;
  });
  return v;
}

/* AI：價值評估 + 對手最佳回擊（與 App 端 xdAiAction 同構） */
function aiAction(s, cfg, level){
  var acts = legalActions(s, cfg);
  if (!acts.length) return null;
  if (level <= 0 || sideOf(s, s.turn) === null) return acts[Math.floor(Math.random()*acts.length)];
  function valueOf(a){
    var r = applyAction(s, a, cfg);
    if (!r.ok) return -1e9;
    if (statusOf(r.state, cfg).over){
      var st = statusOf(r.state, cfg);
      return st.winnerSeat === s.turn ? 1e6 : -1e6;
    }
    var base = evalFor(r.state, s.turn);
    if (a.flip) return base - 6.0;
    var opp = legalActions(r.state, cfg), worst = 1e9, i, rr;
    for (i=0;i<opp.length;i++){
      rr = applyAction(r.state, opp[i], cfg);
      if (!rr.ok) continue;
      if (rr.flipped) continue;
      var v2 = evalFor(rr.state, s.turn);
      if (v2 < worst) worst = v2;
    }
    if (worst === 1e9) worst = base;
    return level >= 2 ? (base*0.35 + worst*0.65) : (base*0.75 + worst*0.25);
  }
  var best = acts[0], bestV = -1e18, i, v;
  for (i=0;i<acts.length;i++){
    v = valueOf(acts[i]);
    if (v > bestV){ bestV = v; best = acts[i]; }
  }
  return best;
}

/* ================= 回合狀態文案（與 App 端 xdTurnInfo 一致） ================= */
function turnInfo(state, cfg, vsAi, thinking, over, endTitle){
  if (over){
    return {
      headline: (endTitle && endTitle.length) ? endTitle : "對局結束 · 無行動方",
      detail: "本局已結束，可再來一局或換模式",
      mine: false, ended: true
    };
  }
  var acts = legalActions(state, cfg);
  var canFlip = acts.some(function(a){ return a.flip; });
  var canMove = acts.some(function(a){ return !a.flip; });
  var seat = state.turn;
  var mine = seat === 0;
  var side = sideOf(state, seat);
  var color = side === null ? "陣營未定" : (side ? "紅方" : "黑方");
  var who = mine ? (vsAi ? "你" : "先手") : (vsAi ? "AI" : "後手");
  var chainNote = state.chainUsed > 0 ? "（連食再一步）" : "";
  var headline;
  if (side === null && mine && vsAi) headline = "輪到你 · 陣營未定";
  else if (side === null) headline = who + " 回合 · 陣營未定";
  else if (mine && vsAi) headline = "輪到你 · " + color + chainNote;
  else if (vsAi && thinking) headline = "AI 思考中 · " + color + "…";
  else if (vsAi) headline = "AI 回合 · " + color;
  else headline = "輪到" + who + " · " + color + chainNote;

  var meActing = mine && vsAi;
  var actionText;
  if (side === null) actionText = vsAi ? "請翻第一枚暗棋決定陣營" : who + " 先翻一枚暗棋決定陣營";
  else if (!canFlip && !canMove) actionText = meActing ? "無任何合法步可走" : who + " 無任何合法步可走";
  else if (!canFlip) actionText = meActing ? "請移動明棋" : who + " 只能移動明棋";
  else if (!canMove) actionText = meActing ? "請翻一枚暗棋" : who + " 只能翻暗棋";
  else actionText = meActing ? "請翻一枚暗棋或移動明棋" : who + " 可翻暗棋或移動明棋";

  var detail;
  if (meActing) detail = actionText;
  else if (vsAi && thinking) detail = "請稍候，AI 正在選子";
  else if (vsAi) detail = "請稍候，等待 AI 出手";
  else detail = actionText;

  return { headline: headline, detail: detail, mine: mine, ended: false };
}

/* ================= 介面 ================= */
var state = newState();
var cfg = { fog:false, rookRush:false, chain:false };
var vsAi = true;
var aiLevel = 2;
var sel = -1;
var moves = 0;
var history = [];
var thinking = false;
var over = false;
var endTitle = "";
var eventText = "";
var tip = "先隨意翻開一枚暗棋，那枚棋的顏色就是你的陣營";
var warn = false;
var logLines = [];
var aiTimer = null;

var $ = function(id){ return document.getElementById(id); };

function seatName(seat){ return vsAi ? (seat === 0 ? "我方" : "AI") : (seat === 0 ? "先手" : "後手"); }
function colorName(seat){
  var s = sideOf(state, seat);
  return s === null ? "陣營未定" : (s ? "紅方" : "黑方");
}

function resetGame(keepCfg){
  if (aiTimer){ clearTimeout(aiTimer); aiTimer = null; }
  state = newState();
  sel = -1; moves = 0; history = []; thinking = false; over = false;
  endTitle = ""; eventText = "";
  warn = false;
  tip = "先隨意翻開一枚暗棋，那枚棋的顏色就是你的陣營";
  logLines = [];
  render();
}

function finish(seat, reason){
  over = true;
  var seatRed = state.seatARed === null ? true : state.seatARed;
  var winnerRed = seat === 0 ? seatRed : !seatRed;
  var who = seatName(seat);
  var colorTxt = winnerRed ? "紅" : "黑";
  endTitle = who + " 勝（執" + colorTxt + "）";
  eventText = who + " 勝";
  tip = who + " 勝（執" + colorTxt + "）・" + reason;
  logLines.push("—— 終局：" + who + " 勝（執" + colorTxt + "）・" + reason + " ——");
  thinking = false;
}

function render(){
  var ti = turnInfo(state, cfg, vsAi, thinking, over, endTitle);
  var bar = $("turnBar");
  bar.className = "turn " + (ti.ended ? "end" : (ti.mine ? "mine" : "ai"));
  $("turnHead").textContent = ti.headline;
  $("turnDetail").textContent = ti.detail;
  $("turnTag").textContent = ti.ended ? "終局" : (thinking ? "AI 思考中…" : ("第 " + moves + " 手"));
  $("turnSide").textContent = ti.ended ? "已結束" : (vsAi ? (ti.mine ? "我方行動" : "AI 行動") : (state.turn === 0 ? "先手行動" : "後手行動"));
  $("lastEvent").textContent = eventText ? ("上一手：" + eventText) : "";

  $("cntRed").textContent = countOf(state, true);
  $("cntBlack").textContent = countOf(state, false);
  var s = sideOf(state, 0);
  $("mySide").textContent = vsAi ? (s === null ? "未定" : (s ? "紅方" : "黑方")) : (s === null ? "未定" : (s ? "先手紅" : "先手黑"));
  $("cntMove").textContent = moves;

  var msg = $("msg");
  msg.textContent = tip;
  msg.className = "msg" + (warn ? " warn" : "");

  var acts = over ? [] : legalActions(state, cfg);
  var canGo = {}, canAtk = {};
  acts.forEach(function(a){
    if (a.flip) return;
    if (sel >= 0 && a.from === sel){ canGo[a.to] = true; if (state.board[a.to]) canAtk[a.to] = true; }
  });

  var board = $("board");
  board.innerHTML = "";
  for (var i=0;i<XD_SIZE;i++){
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.setAttribute("data-i", i);
    if (i === sel) cell.classList.add("sel");
    if (canGo[i]) cell.classList.add("hint");
    if (canAtk[i]) cell.classList.add("atk");
    var p = state.board[i];
    var el = document.createElement("div");
    if (!p){
      el.className = "piece";
      el.style.background = "transparent";
      el.style.border = "0";
    } else if (!p.revealed){
      el.className = "piece back";
      el.textContent = "棋";
    } else {
      el.className = "piece " + (p.red ? "red" : "black");
      el.textContent = pLabel(p);
    }
    cell.appendChild(el);
    board.appendChild(cell);
  }

  $("btnUndo").disabled = history.length === 0 || thinking;
  $("btnMode").textContent = "對 AI：" + (vsAi ? "開" : "關（雙人）");

  var log = $("log");
  log.innerHTML = "";
  logLines.forEach(function(t){
    var d = document.createElement("div"); d.textContent = t; log.appendChild(d);
  });
  log.scrollTop = log.scrollHeight;
}

function doAction(a){
  var before = state;
  var victim = (!a.flip && before.board[a.to]) ? before.board[a.to] : null;
  var flipper = (a.flip && before.board[a.to]) ? before.board[a.to] : null;
  var res = applyAction(state, a, cfg);
  if (!res.ok){ tip = res.text; warn = true; render(); return false; }
  history.push(before);
  state = res.state;
  sel = -1; moves++; warn = false;
  logLines.push(moves + ". " + seatName(1 - state.turn) + "：" + res.text);
  if (a.flip){
    eventText = "翻開 " + (flipper ? pLabel(flipper) : "暗棋");
  } else if (!victim){
    eventText = res.text;
  } else {
    var landed = state.board[a.to];
    eventText = (landed && landed.red === victim.red) ? ("被 " + pLabel(victim) + " 吃掉") : ("吃掉 " + pLabel(victim));
  }
  var st = statusOf(state, cfg);
  if (st.over) finish(st.winnerSeat === null ? (1 - state.turn) : st.winnerSeat, st.reason);
  else tip = res.text;
  render();
  return true;
}

function scheduleAi(){
  if (!vsAi || over) return;
  if (state.turn !== 1) return;
  thinking = true;
  render();
  if (aiTimer) clearTimeout(aiTimer);
  aiTimer = setTimeout(function(){
    aiTimer = null;
    if (over){ thinking = false; render(); return; }
    thinking = false;
    var a = aiAction(state, cfg, aiLevel);
    if (!a){ tip = "AI 無步可走"; render(); return; }
    doAction(a);
    if (!over && state.turn === 1) scheduleAi();
    else render();
  }, 560);
}

$("board").addEventListener("click", function(e){
  if (over || thinking) return;
  if (vsAi && state.turn === 1) return;
  var cell = e.target.closest ? e.target.closest(".cell") : null;
  if (!cell) return;
  var i = parseInt(cell.getAttribute("data-i"), 10);
  if (isNaN(i)) return;

  if (sel === i){ sel = -1; render(); return; }
  var a = tapAction(state, cfg, sel, i);
  if (a){
    var ok = doAction(a);
    if (ok && vsAi && !over) scheduleAi();
    return;
  }
  var p = state.board[i];
  if (p && p.revealed){
    var side = sideOf(state, state.turn);
    if (side !== null && p.red === side){
      sel = i; warn = false; tip = "已選 " + pLabel(p) + "：點綠框格走子或吃子"; render(); return;
    }
    tip = "那是對方的棋，不能動"; warn = true; render(); return;
  }
  if (p && !p.revealed){
    tip = "這枚暗棋現在不能翻（先處理已選的走子）"; warn = true; render(); return;
  }
  sel = -1; warn = false; render();
});

$("btnNew").addEventListener("click", function(){ resetGame(true); if (vsAi) { /* 先手一直是我方 */ } render(); });
$("btnUndo").addEventListener("click", function(){
  if (thinking || history.length === 0) return;
  var steps = (vsAi && history.length >= 2) ? 2 : 1;
  for (var k=0;k<steps && history.length;k++) state = history.pop();
  moves = Math.max(0, moves - steps);
  logLines = logLines.slice(0, Math.max(0, logLines.length - steps));
  sel = -1; warn = false; over = false; endTitle = ""; eventText = "";
  tip = "已悔棋｜" + turnInfo(state, cfg, vsAi, false, false, "").headline;
  render();
});
$("btnMode").addEventListener("click", function(){
  vsAi = !vsAi;
  resetGame(true);
  tip = "已切換為" + (vsAi ? "對 AI 模式" : "同機雙人模式");
  render();
});
$("swFog").addEventListener("click", function(){
  cfg.fog = !cfg.fog; this.classList.toggle("on", cfg.fog);
  tip = "搏大霧：" + (cfg.fog ? "已開啟（可貼身撞吃暗棋）" : "已關閉");
  warn = false; sel = -1; render();
});
$("swRook").addEventListener("click", function(){
  cfg.rookRush = !cfg.rookRush; this.classList.toggle("on", cfg.rookRush);
  tip = "車直衝多格：" + (cfg.rookRush ? "已開啟" : "已關閉");
  warn = false; sel = -1; render();
});
$("swChain").addEventListener("click", function(){
  cfg.chain = !cfg.chain; this.classList.toggle("on", cfg.chain);
  tip = "連食：" + (cfg.chain ? "已開啟（吃子後可再走一步）" : "已關閉");
  warn = false; sel = -1; render();
});

/* 對外暴露：供自測探針呼叫 */
window.__xqBlind = {
  newState: newState, legalActions: legalActions, applyAction: applyAction,
  statusOf: statusOf, turnInfo: turnInfo, tapAction: tapAction, aiAction: aiAction,
  getState: function(){ return state; },
  setState: function(s){ state = s; render(); },
  setVsAi: function(v){ vsAi = v; },
  doAction: doAction,
  reset: resetGame
};

render();
})();
</script>

var ENKS=null, MISS={}, MC={};
function trMixed(t,lead,tail){
  if(MC[t]!==undefined) return MC[t];
  if(!ENKS){ENKS=Object.keys(EN).filter(function(k){return k.length>1&&CJK.test(k);}).sort(function(a,b){return b.length-a.length;});}
  var s=t,out='',i=0,n=s.length,hit=false,run='';
  while(i<n){
    var m=null;
    for(var r=0;r<ENKS.length;r++){var k=ENKS[r]; if(k===s.substr(i,k.length)){m=k;break;}}
    if(m){ if(run){MISS[run]=(MISS[run]||0)+1;run='';} out+=EN[m]; i+=m.length; hit=true; }
    else { if(CJK.test(s.charAt(i))) run+=s.charAt(i); else { if(run){MISS[run]=(MISS[run]||0)+1;run='';} } out+=s.charAt(i); i++; }
  }
  if(run) MISS[run]=(MISS[run]||0)+1;
  var res = hit ? (lead+out+tail) : null;
  MC[t]=res; return res;
}

function trans(src){
  try{
    var e=eff();
    if(e==='cn') return conv(src,T2S);
    if(e==='tw') return conv(src,S2T);
    var hit=trEn(src); if(hit===null) return src;
    var out=hit.replace(/，/g,', ').replace(/。/g,'. ').replace(/：/g,': ').replace(/；/g,'; ')
              .replace(/！/g,'!').replace(/？/g,'?').replace(/（/g,' (').replace(/）/g,') ')
              .replace(/、/g,', ').replace(/「/g,'"').replace(/」/g,'"').replace(/　/g,' ')
              .replace(/\s{2,}/g,' ').replace(/\s+([,.!?;:])/g,'$1')
              .replace(/\)\s*\)/g,')').replace(/\(\s*\(/g,'(').trim();
    var op=(out.match(/\(/g)||[]).length, cl=(out.match(/\)/g)||[]).length;
    while(cl>op){out=out.replace(/\)\s*$/,'');cl--;}
    return out;
  }catch(x){return src;}
}
var SKIP={SCRIPT:1,STYLE:1,NOSCRIPT:1,CODE:1,PRE:1,TEXTAREA:1};
var orig=new WeakMap(), last=new WeakMap();
var ATTRS=['placeholder','title','aria-label','alt'];
var STAT={text:0,attr:0,err:0};
function skipNode(n){
  var p=n.parentNode;
  while(p&&p.nodeType===1){
    if(SKIP[p.tagName]) return true;
    var cn=p.className;
    if(typeof cn==='string'&&/(^|\s)(code|codeblock|hljs|lineno)(\s|$)/i.test(cn)) return true;
    if(p.getAttribute&&p.getAttribute('data-i18n-skip')!==null) return true;
    p=p.parentNode;}
  return false;
}
function applyText(n){
  try{
    if(!n||n.nodeType!==3) return;
    if(skipNode(n)) return;
    var rec=orig.get(n);
    if(!rec){ if(!CJK.test(n.data)) return;
      if(/function\s*\(|=>|\bvar\s+\w+\s*=|MIG-EXPORT|\{\s*$/.test(n.data)) return;
      rec={t:n.data}; orig.set(n,rec); }
    var out=trans(rec.t);
    if(n.data!==out){ n.data=out; last.set(n,out); STAT.text++; }
  }catch(x){STAT.err++;}
}
function applyAttr(el){
  try{
    if(!el||el.nodeType!==1) return;
    if(SKIP[el.tagName]) return;
    if(el.getAttribute&&el.getAttribute('data-i18n-skip')!==null) return;
    for(var i=0;i<ATTRS.length;i++){var a=ATTRS[i];var v=el.getAttribute(a);
      if(!v||!CJK.test(v)) continue;
      var key='i18nO'+a.replace('-','');
      if(!el.dataset[key]) el.dataset[key]=v;
      var o=v, out=trans(el.dataset[key]);
      if(o!==out){ el.setAttribute(a,out); STAT.attr++; }
    }
  }catch(x){STAT.err++;}
}
function walk(root){
  try{
    if(!root) return;
    if(root.nodeType===3){applyText(root);return;}
    if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11) return;
    applyAttr(root);
    var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,null,false),n;
    while((n=tw.nextNode())){ if(n.nodeType===3) applyText(n); else applyAttr(n); }
  }catch(x){STAT.err++;}
}
function render(){
  try{
    document.documentElement.lang=(eff()==='en'?'en':(eff()==='cn'?'zh-CN':'zh-TW'));
    walk(document.body);
    try{ if(!window.__t0title&&document.title&&CJK.test(document.title)) window.__t0title=document.title;
         if(window.__t0title){var tt=trans(window.__t0title); if(document.title!==tt) document.title=tt;} }catch(x){}
    var b=document.getElementById('i18nBtn');
    if(b) b.textContent='🌐 '+(eff()==='en'?'EN':(eff()==='cn'?'简':'繁'));
  }catch(x){}
}
var mo=new MutationObserver(function(muts){
  for(var i=0;i<muts.length;i++){var m=muts[i];
    try{
      if(m.type==='characterData'){
        var n=m.target, rec=orig.get(n), out=last.get(n);
        if(rec&&n.data===out) continue;
        if(n.data&&CJK.test(n.data)){orig.set(n,{t:n.data});applyText(n);} else {last.set(n,n.data);}
      }else{
        for(var j=0;j<m.addedNodes.length;j++){var an=m.addedNodes[j];
          if(an.nodeType===1||an.nodeType===3) walk(an);}
      }
    }catch(x){STAT.err++;}
  }
});
function ui(){
  var box=document.createElement('div');
  box.setAttribute('data-i18n-skip','1');
  box.style.cssText='position:fixed;right:12px;bottom:14px;z-index:2147483000;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;text-align:right;';
  var panel=document.createElement('div');
  panel.style.cssText='display:none;margin-bottom:8px;background:#0d1420;border:1px solid #2b3a4f;border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:160px;text-align:left;';
  var opts=[['auto','跟隨系統 / Auto'],['tw','繁體中文'],['cn','简体中文'],['en','English']];
  opts.forEach(function(o){
    var b=document.createElement('div');
    b.textContent=o[1];
    b.style.cssText='padding:9px 12px;color:#dbe7f3;font-size:14px;border-radius:8px;cursor:pointer;white-space:nowrap;';
    b.onclick=function(){chosen=o[0];localStorage.setItem(KEY,chosen);render();
      Array.prototype.forEach.call(panel.children,function(c){c.style.background='transparent';c.style.color='#dbe7f3';});
      b.style.background='#1b5e20';b.style.color='#b9f6ca';};
    if(chosen===o[0]){b.style.background='#1b5e20';b.style.color='#b9f6ca';}
    panel.appendChild(b);
  });
  var btn=document.createElement('div');
  btn.id='i18nBtn';btn.textContent='🌐 繁';
  btn.style.cssText='margin-left:auto;width:52px;height:34px;line-height:34px;text-align:center;background:#12384a;color:#8be9fd;border:1px solid #2b6c86;border-radius:17px;font-size:13px;cursor:pointer;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.45);';
  btn.onclick=function(){panel.style.display=panel.style.display==='none'?'block':'none';};
  box.appendChild(panel);box.appendChild(btn);
  document.body.appendChild(box);
}
window.__i18n={trans:trans,eff:eff,EN:EN,MISS:MISS,applyText:applyText,walk:walk,skip:skipNode,STAT:STAT,
  setLang:function(v){chosen=v;localStorage.setItem(KEY,v);render();}};
function boot(){ui();render();mo.observe(document.body,{childList:true,subtree:true,characterData:true});}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
